<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4EBE3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="75 HARD" />
  <title>Gabby · 75 HARD</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body data-tab="today">
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow">75 HARD</p>
        <button type="button" class="wordmark" id="btn-home">GABBY</button>
      </div>
      <div class="top-actions">
        <button type="button" class="text-btn" id="btn-rules">Rules</button>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>
        </svg>
        </button>
      </div>
    </header>

    <nav class="menu" aria-label="Primary">
      <button type="button" data-tab="path" class="menu-btn tile-path">
        <em>map</em>
        <strong>Path</strong>
      </button>
      <button type="button" data-tab="diary" class="menu-btn tile-diary">
        <em>write</em>
        <strong>Diary</strong>
      </button>
      <button type="button" data-tab="todo" class="menu-btn tile-todo">
        <em>list</em>
        <strong>To-do</strong>
      </button>
      <button type="button" data-tab="spark" class="menu-btn tile-spark">
        <em>words</em>
        <strong>Spark</strong>
      </button>
    </nav>

    <main id="main"></main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="sheet-title">
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
